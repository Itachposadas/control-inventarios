# Publicación de prueba en Render (plan gratis).
# Render lee este archivo al crear un "Blueprint" desde el repositorio de GitHub.
# Los valores con sync: false se capturan a mano en el panel de Render (no se suben a git).

services:
  # ─── Backend: API en Flask ───
  - type: web
    name: parque-vehicular-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Sin healthCheckPath: si la BD falla, la API se publica igual y /api/health muestra el problema
    startCommand: gunicorn "app:create_app()" --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: defaultdb
      # ca.pem de Aiven, subido como "Secret File" en Render
      - key: DB_SSL_CA
        value: /etc/secrets/ca.pem
      # Dirección del frontend publicado (ej. https://parque-vehicular.onrender.com)
      - key: CORS_ORIGINS
        sync: false

  # ─── Frontend: React compilado como sitio estático ───
  - type: web
    name: parque-vehicular
    runtime: static
    rootDir: frontend
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.19.0
      # Dirección del backend publicado + /api (ej. https://parque-vehicular-api.onrender.com/api)
      - key: VITE_API_URL
        sync: false
    # React Router: cualquier ruta carga index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
